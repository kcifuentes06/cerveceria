<!DOCTYPE html>
<html lang="en">
<head>
    <title>Bootstrap Example</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
<nav class="navbar navbar-expand-sm bg-light">
  <div class="container-fluid">
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" href="#">Catalogo</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#">Mi Cuenta</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#">Link 3</a>
      </li>
    </ul>
  </div>
</nav>

<header>
    <nav>
        <a href="index.html" class="logo">
            <img src="logo_cerveceria.png" alt="Logo de la Cervecería">
        </a>
        <a href="carrito.html" class="cart">
            <img src="carrito_icon.png" alt="Carrito de Compras">
        </a>
    </nav>
</header>

<div class="herramientas-catalogo">

    <div class="search-container">
        <label for="search-bar">Buscar:</label>
        <input type="text" id="search-bar" placeholder="Busca tu cerveza...">
    </div>

    <div class="filter-container">
        <label for="filtro-cervezas">Filtrar por tipo:</label>
        <select id="filtro-cervezas" name="filtro-cervezas">
            <option value="todas">Todas</option>
            <option value="lager">Lager</option>
            <option value="ale">Ale</option>
            <option value="stout">Stout</option>
            <option value="ipa">IPA</option>
        </select>
    </div>

</div>

<section class="catalogo-productos">
    <ul id="lista-cervezas">
        <li class="cerveza-item">
            <img src="cerveza_lager.png" alt="Cerveza Lager">
            <h3>Nombre de la Cerveza Lager</h3>
            <p>Una cerveza ligera y refrescante.</p>
            <span>$5.500 CLP</span>
            <button class="add-to-cart">Agregar al carrito</button>
        </li>
        <li class="cerveza-item">
            <img src="cerveza_ipa.png" alt="Cerveza IPA">
            <h3>Nombre de la Cerveza IPA</h3>
            <p>Con un sabor amargo y aromas a lúpulo.</p>
            <span>$6.200 CLP</span>
            <button class="add-to-cart">Agregar al carrito</button>
        </li>
        </ul>
</section>

<div class="paginacion">
    <button id="anterior">Anterior</button>
    <button id="siguiente">Siguiente</button>
</div>
