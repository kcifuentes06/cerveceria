<!DOCTYPE html>
<html lang="es">
<head>
    <title>Craaft & Beer - Catálogo</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #5a3825 40%, #3e2417 100%);
            font-family: 'Georgia', serif;
            background-attachment: fixed;
        }
        .navbar {
            background-color: rgba(90, 56, 37, 0.95);
        }
        .navbar-brand, .nav-link {
            color: #f8e2c9 !important;
            font-weight: bold;
        }
        .nav-link:hover {
            color: #ffd27f !important;
        }
        header {
            background: rgba(0,0,0,0.6);
            padding: 2rem;
            color: #fdf6e3;
            text-align: center;
            border-bottom: 4px solid #a05a2c;
        }
        header h1 {
            font-size: 2rem;
            margin: 0;
        }
        .contenedor-translucido {
            background: rgba(255, 247, 236, 0.9);
            border-radius: 12px;
            padding: 2rem;
            margin-top: 2rem;
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }
        .form-control, .form-select {
            border-radius: 8px;
            border: 1px solid #c49a6c;
        }
        .btn-primary {
            background-color: #a05a2c;
            border: none;
        }
        .btn-primary:hover {
            background-color: #7a431f;
        }
        .btn-success {
            background-color: #d4a017;
            border: none;
        }
        .btn-success:hover {
            background-color: #b8860b;
        }
        .pagination .page-link {
            color: #5a3825;
            border: none;
            font-weight: bold;
        }
        .pagination .page-link:hover {
            background-color: #f4d19d;
            color: #5a3825;
        }
        .product-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="catalog.html">
      🍺 Craft & Beer
    </a>
    <ul class="navbar-nav ms-auto">
      <li class="nav-item"><a class="nav-link" href="catalog.html">Catálogo</a></li>
      <li class="nav-item"><a class="nav-link" href="login.html">Mi Cuenta</a></li>
      <li class="nav-item"><a class="nav-link" href="#">Contacto</a></li>
    </ul>
  </div>
</nav>

<header>
  <div class="container d-flex justify-content-between align-items-center">
    <h1>Bienvenido a Craft & Beer</h1>
    <a href="carrito.html" class="btn btn-warning">🛒 Carrito</a>
  </div>
</header>

<div class="container contenedor-translucido">
  <div class="row g-3 align-items-center mb-4">
    <div class="col-md-4">
      <input type="text" class="form-control" id="search-bar" placeholder="Busca tu producto artesanal...">
    </div>
    <div class="col-md-4">
      <select id="filtro-tipo" class="form-select">
        <option value="todos">Todos</option>
        <option value="cerveza">Cervezas</option>
        <option value="growler">Growlers</option>
      </select>
    </div>
    <div class="col-md-3">
      <select id="filtro-cervezas" class="form-select">
        <option value="todas">Todas las variedades</option>
        <option value="lager">Lager</option>
        <option value="ale">Ale</option>
        <option value="stout">Stout</option>
        <option value="ipa">IPA</option>
      </select>
    </div>
    <div class="col-md-1">
      <button class="btn btn-primary w-100" onclick="cargarProductos()">Buscar</button>
    </div>
  </div>


  <section class="catalogo-productos">
    <ul class="list-group" id="catalogo">
        </ul>
  </section>


  <div class="my-5">
    <nav>
      <ul class="pagination justify-content-center">
        <li class="page-item"><a class="page-link" href="#">Anterior</a></li>
        <li class="page-item"><a class="page-link" href="#">1</a></li>
        <li class="page-item"><a class="page-link" href="#">2</a></li>
        <li class="page-item"><a class="page-link" href="#">3</a></li>
        <li class="page-item"><a class="page-link" href="#">Siguiente</a></li>
      </ul>
    </nav>
  </div>
</div>

<script src="js/catalogo.js"></script>

</body>
</html>
