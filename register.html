<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Cervecería Artesanal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #fdf6e3;
      font-family: 'Georgia', serif;
      color: #3e2723;
    }
    .register-container {
      max-width: 450px;
      margin: 3rem auto;
      padding: 2rem;
      background-color: #fff8e1;
      border-radius: 10px;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
    }

    .navbar {
      background-color: rgba(90, 56, 37, 0.95);
    }
    .navbar-brand, .nav-link {
      color: #f8e2c9 !important;
      font-weight: bold;
    }
    .nav-link:hover {
      color: #ffd27f !important;
    }
    h2 {
      text-align: center;
      color: #4e342e;
      font-weight: bold;
      margin-bottom: 1.5rem;
    }
    label {
      font-weight: bold;
      margin-top: 0.5rem;
    }
    input {
      width: 100%;
      padding: 0.6rem;
      border-radius: 6px;
      border: 1px solid #bcaaa4;
      margin-bottom: 1rem;
    }
    input:focus {
      outline: none;
      border-color: #6d4c41;
      box-shadow: 0px 0px 5px rgba(109,76,65,0.5);
    }
    .btn-register {
      background-color: #4e342e;
      color: #fff;
      border: none;
      width: 100%;
      padding: 0.7rem;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 1rem;
      transition: background 0.3s ease;
      cursor: pointer;
    }
    .btn-register:hover {
      background-color: #6d4c41;
    }
    .options {
      text-align: center;
      font-size: 0.9rem;
      margin-top: 1rem;
    }
    .options a {
      color: #6d4c41;
      text-decoration: none;
    }
    .options a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>


<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="catalog.html">
      🍺 Craft & Beer
    </a>
    <ul class="navbar-nav ms-auto">
      <li class="nav-item"><a class="nav-link" href="catalog.html">Catálogo</a></li>
      <li class="nav-item"><a class="nav-link" href="login.html">Mi Cuenta</a></li>
      <li class="nav-item"><a class="nav-link" href="#">Contacto</a></li>
    </ul>
  </div>
</nav>

<div class="register-container">
  <h2>Crear Cuenta</h2>
  <form id="register-form">
    <label for="nombre">Nombre Completo:</label>
    <input type="text" id="nombre" name="nombre" required>

    <label for="rut">RUT:</label>
    <input type="text" id="rut" name="rut" required>

    <label for="email">Correo electrónico:</label>
    <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>

    <label for="password">Contraseña:</label>
    <input type="password" id="password" name="password" required>
    
    <p id="mensaje-feedback" style="text-align: center; margin-top: 1rem;"></p>

    <button type="submit" class="btn-register">Registrarse</button>

    <div class="options">
      ¿Ya tienes cuenta? <a href="login.html">Iniciar Sesión</a>
    </div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
