<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña - Cervecería Artesanal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #fdf6e3;
      font-family: 'Georgia', serif;
      color: #3e2723;
    }
    .recuperacion-container {
      max-width: 400px;
      margin: 5rem auto;
      padding: 2rem;
      background-color: #fff8e1;
      border-radius: 10px;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
    }
    /* Navbar estilo madera */
    .navbar {
      background-color: rgba(90, 56, 37, 0.95);
        }
    .navbar-brand, .nav-link {
      color: #f8e2c9 !important;
      font-weight: bold;
    }
    .nav-link:hover {
      color: #ffd27f !important;
    }
    h2 {
      text-align: center;
      color: #4e342e;
      font-weight: bold;
      margin-bottom: 1.5rem;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 1rem;
      margin-bottom: 0.3rem;
    }
    input {
      width: 100%;
      padding: 0.6rem;
      border-radius: 6px;
      border: 1px solid #bcaaa4;
      margin-bottom: 1rem;
    }
    input:focus {
      outline: none;
      border-color: #6d4c41;
      box-shadow: 0px 0px 5px rgba(109,76,65,0.5);
    }
    .btn-recuperar {
      background-color: #6d4c41;
      color: #fff;
      border: none;
      width: 100%;
      padding: 0.7rem;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 0.5rem;
      transition: background 0.3s ease;
    }
    .btn-recuperar:hover {
      background-color: #8d6e63;
    }
    .options {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }
    .options a {
      color: #6d4c41;
      text-decoration: none;
    }
    .options a:hover {
      text-decoration: underline;
      color: #8d6e63;
    }
    p.instrucciones {
      font-size: 0.95rem;
      margin-bottom: 1rem;
      color: #4e342e;
    }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="#">
      🍺 Craft & Beer
    </a>
    <ul class="navbar-nav ms-auto">
      <li class="nav-item"><a class="nav-link" href="#">Catálogo</a></li>
      <li class="nav-item"><a class="nav-link" href="#">Mi Cuenta</a></li>
      <li class="nav-item"><a class="nav-link" href="#">Contacto</a></li>
    </ul>
  </div>
</nav>

<div class="recuperacion-container">
  <h2>Recuperar Contraseña</h2>
  <p class="instrucciones">Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</p>
  <form>
    <label for="email">Correo electrónico:</label>
    <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>

    <button type="submit" class="btn-recuperar">Enviar enlace</button>

    <div class="options">
      <a href="login.html">Volver al login</a>
      <a href="registro.html">Crear cuenta</a>
    </div>
  </form>
</div>

</body>
</html>
