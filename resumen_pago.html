<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumen de Pago</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #fdf6e3; font-family: 'Georgia', serif; color: #3e2723; text-align: center; }
        .navbar { background-color: rgba(90, 56, 37, 0.95); }
        .navbar-brand { color: #f8e2c9 !important; font-weight: bold; }
        .summary-container { max-width: 600px; margin: 5rem auto; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .success { background-color: #e8f5e9; border: 2px solid #4caf50; }
        .failure { background-color: #ffebee; border: 2px solid #f44336; }
        .pending { background-color: #fff3e0; border: 2px solid #ff9800; }
        h1 { color: #4e342e; font-weight: bold; }
        .total-amount { font-size: 2.5rem; font-weight: bold; color: #3e2723; margin-top: 10px; }
        .btn-return { background-color: #6d4c41; color: white; margin-top: 20px; }
        .btn-return:hover { background-color: #8d6e63; color: white; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="catalog.html">🍺 Craft & Beer</a>
    </div>
</nav>

<div class="summary-container" id="summary-card">
    <div id="loading-message">Cargando estado del pago...</div>
    
    <div id="content" style="display: none;">
        <h1 id="status-title"></h1>
        <p class="lead" id="status-message"></p>
        
        <h3>Monto del Pedido</h3>
        <p class="total-amount" id="order-total">$ --,-- CLP</p>
        
        <p id="order-id-display" class="text-muted" style="font-size: 0.9rem;"></p>
        
        <a href="mi_cuenta.html" class="btn btn-return btn-lg">Ver Historial de Pedidos</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/resumen_pago.js"></script>

</body>
</html>
