<!DOCTYPE html>
<html lang="es">
<head>
    <title>Admin Productos - Cervecería</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { background-color: #fdf6e3; font-family: 'Georgia', serif; color: #3e2723; }
        .navbar { background-color: rgba(90, 56, 37, 0.95); }
        .navbar-brand, .nav-link { color: #f8e2c9 !important; font-weight: bold; }
        .container { background-color: #fff8e1; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-top: 20px; }
        .table th { background-color: #6d4c41; color: white; }
        .table td, .table th { vertical-align: middle; }
        .product-img-admin { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="catalog.html">🍺 Craft & Beer Admin</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="catalog.html">Catálogo Público</a></li>
            <li class="nav-item"><a class="nav-link" id="logout-btn" href="#">Cerrar Sesión</a></li>
        </ul>
    </div>
</nav>

<div class="container">
    <h2 class="mb-4 text-center">Gestión de Productos</h2>
    
    <div class="d-flex justify-content-between mb-3">
        <h4>Listado de Productos</h4>
        <button id="add-product-btn" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#productModal">
            + Agregar Nuevo Producto
        </button>
    </div>

    <div class="table-responsive">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Imagen</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Tipo</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="productos-table-body">
                </tbody>
        </table>
    </div>

</div>

<div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="productModalLabel">Crear/Editar Producto</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="product-form">
                    <input type="hidden" id="product-id" name="id"> 

                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombre" required>
                    </div>
                    <div class="mb-3">
                        <label for="descripcion" class="form-label">Descripción</label>
                        <textarea class="form-control" id="descripcion" rows="2"></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="precio" class="form-label">Precio ($)</label>
                            <input type="number" class="form-control" id="precio" required min="100">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="stock" class="form-label">Stock</label>
                            <input type="number" class="form-control" id="stock" required min="0">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="tipo" class="form-label">Tipo</label>
                            <select class="form-select" id="tipo" required>
                                <option value="">Selecciona Tipo</option>
                                <option value="cerveza">Cerveza</option>
                                <option value="growler">Growler</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="variedad" class="form-label">Variedad</label>
                            <input type="text" class="form-control" id="variedad" placeholder="IPA, Lager, n/a">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="imagen_url" class="form-label">URL de Imagen</label>
                        <input type="text" class="form-control" id="imagen_url" placeholder="img/ejemplo.webp">
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100">Guardar Producto</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="js/admin_productos.js"></script>

</body>
</html>
