<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cuenta - Cervecería Artesanal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #fdf6e3;
            font-family: 'Georgia', serif;
            color: #3e2723;
        }

        .navbar {
            background-color: rgba(90, 56, 37, 0.95);
        }
        .navbar-brand, .nav-link {
            color: #f8e2c9 !important;
            font-weight: bold;
        }
        .nav-link:hover {
            color: #ffd27f !important;
        }
        .container-perfil {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 2rem;
            background-color: #fff8e1;
            border-radius: 10px;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
        }
        h2, h3 {
            color: #4e342e;
            font-weight: bold;
        }
        .seccion {
            border-bottom: 2px solid #bcaaa4;
            padding-bottom: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .btn-cerrar {
            background-color: #d32f2f;
            color: white;
            border: none;
        }
        .btn-cerrar:hover {
            background-color: #c62828;
            color: white;
        }

        
        .pedido-card {
            border: 1px solid #d7ccc8;
            border-radius: 8px;
            margin-bottom: 1rem;
            padding: 1rem;
            background-color: #f5f5f5;
        }
        .pedido-estado {
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 5px;
            display: inline-block;
        }
        
        .estado-PENDIENTE_PAGO { background-color: #ffcc80; color: #e65100; }
        .estado-PAGADO { background-color: #a5d6a7; color: #2e7d32; }
        .estado-ENVIADO { background-color: #81d4fa; color: #0277bd; }
        .estado-ENTREGADO { background-color: #e6ee9c; color: #827717; }
        .estado-CANCELADO { background-color: #ef9a9a; color: #c62828; }
        
        .detalle-item {
            font-size: 0.9rem;
            margin-left: 1rem;
            border-left: 2px solid #bcaaa4;
            padding-left: 10px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="catalog.html">
            🍺 Craft & Beer
        </a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="catalog.html">Catálogo</a></li>
            <li class="nav-item"><a class="nav-link" href="carrito.html">Carrito</a></li>
            <li class="nav-item"><a class="nav-link" id="nav-logout" href="#">Cerrar Sesión</a></li>
        </ul>
    </div>
</nav>

<div class="container-perfil">
    <div class="d-flex justify-content-between align-items-center seccion">
        <h2 id="welcome-message">Mi Perfil</h2>
        <button id="logout-btn" class="btn btn-cerrar">Cerrar Sesión</button>
    </div>

    <section class="seccion">
        <h3>Información General</h3>
        <p><strong>Nombre:</strong> <span id="user-name">Cargando...</span></p>
        </section>

    <section>
        <h3 class="mb-3">Historial de Pedidos</h3>
        <div id="historial-pedidos">
            <p id="loading-message" class="text-center">Cargando historial de pedidos...</p>
        </div>
    </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/profile.js"></script> 

</body>
</html>
