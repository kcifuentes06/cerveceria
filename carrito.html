<!DOCTYPE html>
<html lang="es">
<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<nav class="navbar navbar-expand-sm bg-light">
  <div class="container-fluid">
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" href="#">Catalogo</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#">Mi Cuenta</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#">Link 3</a>
      </li>
    </ul>
  </div>
</nav>

<header>
    <h1>Tu Carrito de Compras</h1>
</header>

<main>
    <div id="cart-container">
        <div id="empty-cart-message" style="display: none;">
            <p>Tu carrito está vacío. ¡Es hora de llenarlo con la mejor cerveza!</p>
            <a href="catalogo.html" class="btn-return">
                <button>Volver a la tienda</button>
            </a>
        </div>

        <ul id="cart-items">
            <li class="cart-item">
                <img src="cerveza_lager.png" alt="Cerveza Lager">
                <div class="item-details">
                    <h3>Cerveza Lager</h3>
                    <p>Precio: $5.500 CLP</p>

                    <div class="quantity-control">
                        <button class="decrease-btn">-</button>
                        <span class="item-quantity">1</span>
                        <button class="increase-btn">+</button>
                    </div>

                </div>
                <button class="remove-item">Eliminar</button>
            </li>
        </ul>
    
    <div id="cart-summary">
        <p>Total a pagar: <span id="cart-total">$0 CLP</span></p>
    </div>
    </div>

    <div class="cart-actions">
        <a href="catalogo.html" class="btn-return">
            <button>Volver a la tienda</button>
        </a>
        <button id="checkout-btn" class="btn-checkout">Continuar al pago</button>
    </div>
</main>
