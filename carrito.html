<!DOCTYPE html>
<html lang="es">
<head>
  <title>Carrito de Compras - Cervecería Artesanal</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    body {
      background-color: #fdf6e3;
      font-family: 'Georgia', serif;
      color: #3e2723;
    }

    .navbar {
      background-color: rgba(90, 56, 37, 0.95);
    }
    .navbar-brand, .nav-link {
      color: #f8e2c9 !important;
      font-weight: bold;
    }
    .nav-link:hover {
      color: #ffd2f7 !important;
    }
    header {
      text-align: center;
      padding: 2rem;
      background-color: #efebe9;
      border-bottom: 4px solid #6d4c41;
    }
    header h1 {
      font-size: 2.5rem;
      font-weight: bold;
      color: #4e342e;
    }
    #cart-container {
      margin: 2rem auto;
      max-width: 900px;
      background: #fff8e1;
      padding: 1.5rem;
      border-radius: 10px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
    }
    #cart-items {
      list-style: none;
      padding: 0;
    }
    .cart-item {
      display: flex;
      align-items: center;
      border-bottom: 1px solid #d7ccc8;
      padding: 1rem 0;
    }
    .cart-item img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-right: 1rem;
    }
    .item-details {
      flex-grow: 1;
    }
    .item-details h3 {
      margin: 0;
      font-size: 1.2rem;
      color: #3e2723;
    }
    .item-details p {
      margin: 0.3rem 0;
    }
    .quantity-control {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .quantity-control button {
      background-color: #6d4c41;
      color: #fff;
      border: none;
      padding: 0.3rem 0.7rem;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }
    .remove-item {
      background-color: #d84315;
      color: #fff;
      border: none;
      padding: 0.5rem 0.8rem;
      border-radius: 5px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    #cart-summary {
      margin-top: 1.5rem;
      font-size: 1.2rem;
      font-weight: bold;
      text-align: right;
      border-top: 2px solid #6d4c41;
      padding-top: 1rem;
      color: #4e342e;
    }
    .cart-actions {
      display: flex;
      justify-content: space-between;
      margin-top: 2rem;
    }
    .btn-return-to-store,
    .btn-checkout {
      background-color: #6d4c41;
      color: #fff;
      border: none;
      padding: 0.7rem 1.2rem;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.3s ease;
      cursor: pointer;
    }
    .btn-return-to-store:hover,
    .btn-checkout:hover {
      background-color: #8d6e63;
    }
  </style>
</head>
<body>


<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="catalog.html">
            🍺 Craft & Beer
        </a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="catalog.html">Catálogo</a></li>
            
            <li class="nav-item" id="admin-link-container" style="display: none;">
                <a class="nav-link" href="admin_productos.html" style="color: #ffd27f !important;">
                    🛠️ Panel Admin
                </a>
            </li>

            <li class="nav-item"><a class="nav-link" href="login.html" id="my-account-link">Mi Cuenta</a></li>

            <li class="nav-item" id="logout-link-container" style="display: none;">
                <a class="nav-link" href="#" id="logout-btn">Cerrar Sesión</a>
            </li>
            
            <li class="nav-item"><a class="nav-link" href="carrito.html">🛒 Carrito</a></li>
        </ul>
    </div>
</nav>

<header>
  <h1>Tu Carrito de Compras</h1>
</header>

<main>
  <div id="cart-container">
    <div id="empty-cart-message" style="display: none;">
      <p>Tu carrito está vacío. ¡Es hora de llenarlo con la mejor cerveza!</p>
      <button id="return-to-store-btn" class="btn-return-to-store">Volver a la tienda</button>
    </div>

    <ul id="cart-items">
    </ul>

    <div id="cart-summary">
      <p>Total a pagar: <span id="cart-total">$0 CLP</span></p>
    </div>
  </div>

  <div class="cart-actions">
    <button id="return-to-store-btn-bottom" class="btn-return-to-store">Volver a la tienda</button>
    
    <button id="checkout-btn" class="btn-checkout">Continuar al pago</button>
  </div>
</main>

<script>

    document.getElementById('return-to-store-btn-bottom').addEventListener('click', () => {
        window.location.href = 'catalog.html';
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/carrito.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
