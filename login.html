<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Cervecería Artesanal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #fdf6e3;
      font-family: 'Georgia', serif;
      color: #3e2723;
    }
    .login-container {
      max-width: 400px;
      margin: 5rem auto;
      padding: 2rem;
      background-color: #fff8e1;
      border-radius: 10px;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
    }

    .navbar {
      background-color: rgba(90, 56, 37, 0.95);
    }
    .navbar-brand, .nav-link {
      color: #f8e2c9 !important;
      font-weight: bold;
    }
    .nav-link:hover {
      color: #ffd2f7 !important;
    }
    h2 {
      text-align: center;
      color: #4e342e;
      font-weight: bold;
      margin-bottom: 1.5rem;
    }
    label {
      font-weight: bold;
      margin-top: 0.8rem;
    }
    input {
      width: 100%;
      padding: 0.6rem;
      border-radius: 6px;
      border: 1px solid #bcaaa4;
      margin-bottom: 1rem;
    }
    input:focus {
      outline: none;
      border-color: #6d4c41;
      box-shadow: 0px 0px 5px rgba(109,76,65,0.5);
    }
    .btn-login {
      background-color: #6d4c41;
      color: #fff;
      border: none;
      width: 100%;
      padding: 0.7rem;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 0.5rem;
      transition: background 0.3s ease;
      cursor: pointer;
    }
    .btn-login:hover {
      background-color: #8d6e63;
    }
    .options {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }
    .options a {
      color: #6d4c41;
      text-decoration: none;
    }
    .options a:hover {
      text-decoration: underline;
      color: #8d6e63;
    }
    .checkbox {
      display: flex; 
      align-items: center; 
      margin-bottom: 1rem; 
      font-size: 0.9rem; 
      gap: 0.4rem; 
    }
    .checkbox input[type="checkbox"] { 
      width: 18px; 
      height: 18px; 
      margin: 0; 
    }
  </style>
</head>
<body>


<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="catalog.html">
      🍺 Craft & Beer
    </a>
    <ul class="navbar-nav ms-auto">
      <li class="nav-item"><a class="nav-link" href="catalog.html">Catálogo</a></li>
      <li class="nav-item"><a class="nav-link" href="login.html">Mi Cuenta</a></li>
      <li class="nav-item"><a class="nav-link" href="#">Contacto</a></li>
    </ul>
  </div>
</nav>

<div class="login-container">
  <h2>Iniciar Sesión</h2>
  <form id="login-form">
    <label for="email">Correo electrónico:</label>
    <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>

    <label for="password">Contraseña:</label>
    <input type="password" id="password" name="password" placeholder="********" required>

    <div class="checkbox">
      <input type="checkbox" id="remember" name="remember">
      <label for="remember">Recordarme</label>
    </div>
    
    <p id="mensaje-error" style="color: red; text-align: center; margin-bottom: 1rem;"></p>

    <button type="submit" class="btn-login">Iniciar Sesión</button>

    <div class="options">
      <a href="recovery.html">Olvidé mi contraseña</a>
      <a href="register.html">Crear cuenta</a>
    </div>
  </form>
</div>

<script src="js/auth.js"></script>

</body>
</html>
