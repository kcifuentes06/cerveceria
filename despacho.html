<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datos de Despacho - Cervecería Artesanal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #fdf6e3;
      font-family: 'Georgia', serif;
      color: #3e2723;
    }
    h2, h3 {
      color: #4e342e;
      font-weight: bold;
    }

    .navbar {
      background-color: rgba(90, 56, 37, 0.95);
    }
    .navbar-brand, .nav-link {
      color: #f8e2c9 !important;
      font-weight: bold;
    }
    .nav-link:hover {
      color: #ffd2f7 !important;
    }
    .despacho-container {
      max-width: 800px;
      margin: 2rem auto;
      padding: 2rem;
      background-color: #fff8e1;
      border-radius: 10px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
    }
    .direccion-selector {
      margin-bottom: 1.5rem;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 1rem;
      margin-bottom: 0.3rem;
    }
    input, select {
      width: 100%;
      padding: 0.6rem;
      border-radius: 6px;
      border: 1px solid #bcaaa4;
      margin-bottom: 1rem;
      background-color: #fff;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #6d4c41;
      box-shadow: 0px 0px 5px rgba(109,76,65,0.5);
    }
    .detalle-campos {
      background-color: #efebe9;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    .detalle-campos p {
      margin: 0.3rem 0;
    }
    .btn-agregar,
    .btn-actualizar,
    .btn-guardar,
    .btn-checkout {
      background-color: #6d4c41;
      color: #fff;
      border: none;
      padding: 0.7rem 1.2rem;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 1rem;
      transition: background 0.3s ease;
      cursor: pointer;
    }
    .btn-agregar:hover,
    .btn-actualizar:hover,
    .btn-guardar:hover,
    .btn-checkout:hover {
      background-color: #8d6e63;
    }
    form {
      background-color: #fff3e0;
      padding: 1.5rem;
      border-radius: 10px;
      box-shadow: 0px 3px 8px rgba(0,0,0,0.1);
      margin-top: 1.5rem;
    }
    .btn-checkout {
        background-color: #d4a017;
        color: #3e2723;
        font-size: 1.2rem;
    }
    .btn-checkout:hover {
        background-color: #b8860b;
    }
  </style>
</head>
<body>


<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="catalog.html">
            🍺 Craft & Beer
        </a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="catalog.html">Catálogo</a></li>
            
            <li class="nav-item" id="admin-link-container" style="display: none;">
                <a class="nav-link" href="admin_productos.html" style="color: #ffd27f !important;">
                    🛠️ Panel Admin
                </a>
            </li>

            <li class="nav-item"><a class="nav-link" href="login.html" id="my-account-link">Mi Cuenta</a></li>

            <li class="nav-item" id="logout-link-container" style="display: none;">
                <a class="nav-link" href="#" id="logout-btn">Cerrar Sesión</a>
            </li>
            
            <li class="nav-item"><a class="nav-link" href="carrito.html">🛒 Carrito</a></li>
        </ul>
    </div>
</nav>

<section class="despacho-container">
  <h2>Datos de Despacho</h2>

  <div class="direccion-selector" id="select-direccion-container">
    <label for="select-direccion">Selecciona una dirección guardada:</label>
    <select id="select-direccion" name="select-direccion">
      <option value="">Selecciona una dirección...</option>
      </select>
  </div>

  <div id="detalle-direccion-actual" style="display: none;">
    <h3>Detalles de la dirección <span id="detalle-etiqueta"></span></h3>
    <div class="detalle-campos">
      <p><strong>Nombre:</strong> <span id="detalle-nombre"></span></p>
      <p><strong>RUT:</strong> <span id="detalle-rut"></span></p>
      <p><strong>Dirección:</strong> <span id="detalle-direccion"></span></p>
      <p><strong>Número:</strong> <span id="detalle-numero"></span></p>
      <p><strong>Comuna:</strong> <span id="detalle-comuna"></span></p>
      <p><strong>Región:</strong> <span id="detalle-region"></span></p>
      <p><strong>Correo:</strong> <span id="detalle-correo"></span></p>
    </div>
    <button id="actualizar-direccion-btn" class="btn-actualizar">Actualizar Dirección</button>
  </div>
</section>

<div class="text-center">
  <button id="mostrar-form-agregar" class="btn-agregar">Agregar Nueva Dirección</button>
</div>

<form id="form-direccion" style="display: none;" class="despacho-container">
  <h3>Ingresa tu nueva dirección</h3>

  <input type="hidden" id="direccion-id" name="direccion-id"> 

  <label for="etiqueta">Etiqueta (Ej: Casa, Trabajo):</label>
  <input type="text" id="etiqueta" name="etiqueta" required>

  <label for="nombre_receptor">Nombre del Receptor:</label>
  <input type="text" id="nombre_receptor" name="nombre_receptor" required>

  <label for="rut">RUT:</label>
  <input type="text" id="rut" name="rut" required>

  <label for="correo">Correo:</label>
  <input type="email" id="correo" name="correo" required>

  <label for="direccion">Calle:</label>
  <input type="text" id="direccion" name="direccion" required>

  <label for="numero">Número:</label>
  <input type="number" id="numero" name="numero" required>

  <label for="comuna">Comuna:</label>
  <input type="text" id="comuna" name="comuna" required>

  <label for="region">Región:</label>
  <input type="text" id="region" name="region" required>

  <button type="submit" id="guardar-direccion-btn" class="btn-guardar">Guardar Dirección</button>
</form>

<section class="despacho-container text-center my-4">
    <h2>Resumen y Pago</h2>
    <p class="h4">Total a pagar: <span id="total-a-pagar">total-a-pagar</span></p> 
    <button id="confirmar-checkout-btn" class="btn-checkout w-100">CONFIRMAR PEDIDO Y CONTINUAR AL PAGO</button>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/despacho.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
