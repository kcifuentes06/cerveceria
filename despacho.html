<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datos de Despacho - Cervecería Artesanal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #fdf6e3;
      font-family: 'Georgia', serif;
      color: #3e2723;
    }
    h2, h3 {
      color: #4e342e;
      font-weight: bold;
    }

    .navbar {
      background-color: rgba(90, 56, 37, 0.95);
    }
    .navbar-brand, .nav-link {
      color: #f8e2c9 !important;
      font-weight: bold;
    }
    .nav-link:hover {
      color: #ffd27f !important;
    }
    .despacho-container {
      max-width: 800px;
      margin: 2rem auto;
      padding: 2rem;
      background-color: #fff8e1;
      border-radius: 10px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
    }
    .direccion-selector {
      margin-bottom: 1.5rem;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 1rem;
      margin-bottom: 0.3rem;
    }
    input, select {
      width: 100%;
      padding: 0.6rem;
      border-radius: 6px;
      border: 1px solid #bcaaa4;
      margin-bottom: 1rem;
      background-color: #fff;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #6d4c41;
      box-shadow: 0px 0px 5px rgba(109,76,65,0.5);
    }
    .detalle-campos {
      background-color: #efebe9;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    .detalle-campos p {
      margin: 0.3rem 0;
    }
    .btn-agregar,
    .btn-actualizar,
    .btn-guardar {
      background-color: #6d4c41;
      color: #fff;
      border: none;
      padding: 0.7rem 1.2rem;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 1rem;
      transition: background 0.3s ease;
    }
    .btn-agregar:hover,
    .btn-actualizar:hover,
    .btn-guardar:hover {
      background-color: #8d6e63;
    }
    form {
      background-color: #fff3e0;
      padding: 1.5rem;
      border-radius: 10px;
      box-shadow: 0px 3px 8px rgba(0,0,0,0.1);
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>


<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="#">
      🍺 Craft & Beer
    </a>
    <ul class="navbar-nav ms-auto">
      <li class="nav-item"><a class="nav-link" href="#">Catálogo</a></li>
      <li class="nav-item"><a class="nav-link" href="#">Mi Cuenta</a></li>
      <li class="nav-item"><a class="nav-link" href="#">Contacto</a></li>
    </ul>
  </div>
</nav>

<section class="despacho-container">
  <h2>Datos de Despacho</h2>

  <div class="direccion-selector">
    <label for="direcciones-guardadas">Selecciona una dirección guardada:</label>
    <select id="direcciones-guardadas" name="direcciones-guardadas">
      <option value="">Selecciona una dirección...</option>
      <option value="1">Casa (Ej. Los Lirios 123, La Pintana)</option>
    </select>
  </div>

  <div id="direccion-detalle" style="display: none;">
    <h3>Detalles de la dirección</h3>
    <div class="detalle-campos">
      <p><strong>Nombre:</strong> <span id="detalle-nombre"></span></p>
      <p><strong>RUT:</strong> <span id="detalle-rut"></span></p>
      <p><strong>Dirección:</strong> <span id="detalle-direccion"></span></p>
      <p><strong>Número:</strong> <span id="detalle-numero"></span></p>
      <p><strong>Comuna:</strong> <span id="detalle-comuna"></span></p>
      <p><strong>Región:</strong> <span id="detalle-region"></span></p>
      <p><strong>Correo:</strong> <span id="detalle-correo"></span></p>
    </div>
    <button id="actualizar-direccion-btn" class="btn-actualizar">Actualizar Dirección</button>
  </div>
</section>

<div class="text-center">
  <button id="mostrar-form-agregar" class="btn-agregar">Agregar Nueva Dirección</button>
</div>

<form id="form-direccion" style="display: none;">
  <h3>Ingresa tu nueva dirección</h3>

  <label for="nombre">Nombre:</label>
  <input type="text" id="nombre" name="nombre" required>

  <label for="rut">RUT:</label>
  <input type="text" id="rut" name="rut" required>

  <label for="correo">Correo:</label>
  <input type="email" id="correo" name="correo" required>

  <label for="direccion">Dirección:</label>
  <input type="text" id="direccion" name="direccion" required>

  <label for="numero">Número:</label>
  <input type="number" id="numero" name="numero" required>

  <label for="comuna">Comuna:</label>
  <input type="text" id="comuna" name="comuna" required>

  <label for="region">Región:</label>
  <input type="text" id="region" name="region" required>

  <button type="submit" id="guardar-direccion-btn" class="btn-guardar">Guardar Dirección</button>
</form>

</body>
</html>
